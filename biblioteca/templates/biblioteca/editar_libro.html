{% extends 'biblioteca/base.html' %}

{% block title %}Editar: {{ libro.titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">📝 Editar Información del Libro</h4>
                <small class="text-light">ID: {{ libro.id }}</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">Título del Libro</label>
                            <input type="text" name="titulo" class="form-control" value="{{ libro.titulo }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Autor</label>
                            <input type="text" name="autor" class="form-control" value="{{ libro.autor }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">ISBN</label>
                            <input type="text" name="isbn" class="form-control" value="{{ libro.isbn }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Fecha de Publicación</label>
                            <input type="date" name="fecha_publicacion" class="form-control" value="{{ libro.fecha_publicacion|date:'Y-m-d' }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">Precio ($)</label>
                            <input type="number" step="0.01" name="precio" class="form-control" value="{{ libro.precio|stringformat:'.2f' }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label fw-bold">Stock</label>
                            <input type="number" name="stock" class="form-control" value="{{ libro.stock }}" min="0" required>
                        </div>

                        <div class="col-md-12 mb-4">
                            <label class="form-label fw-bold">Descripción </label>
                            <textarea name="descripcion" class="form-control" rows="4">{{ libro.descripcion }}</textarea>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">La edición sincronizará automáticamente con MongoDB.</small>
                        <div>
                            <a href="{% url 'detalle_libro' libro_id=libro.id %}" class="btn btn-link text-secondary text-decoration-none">Descartar cambios</a>
                            <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
